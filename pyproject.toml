[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aula-f75"
version = "0.1.0"
description = "Native Linux configuration tool for the AULA F75 keyboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hidapi>=0.14.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
aula-f75 = "aula_f75.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
