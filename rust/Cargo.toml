[package]
name = "aula-f75"
version = "0.2.0"
edition = "2021"

[lib]
name = "aula_f75"
path = "src/lib.rs"

[[bin]]
name = "aula-f75-rs"
path = "src/main.rs"

[[bin]]
name = "aula-f75-gui"
path = "src/bin/aula-f75-gui.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = "0.31"
libc = "0.2"
